<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>氏族积分中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #16213e;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            background: #0f3460;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input::placeholder { color: #888; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #e94560;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #c13651; }
        .error {
            color: #e94560;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        
        /* 登录后主面板 */
        #dashboard { display: none; }
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #0f3460;
        }
        .points-box {
            background: #e94560;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #aaa;
        }
        .shop-item {
            background: #0f3460;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-item-info h3 { margin-bottom: 5px; }
        .shop-item-info p { color: #aaa; font-size: 13px; }
        .shop-item-cost {
            color: #e94560;
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
        }
        .btn-small {
            width: auto;
            padding: 8px 20px;
            font-size: 14px;
            background: #16c79a;
        }
        .btn-small:hover { background: #12a37e; }
        .btn-small:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #555;
            width: auto;
            padding: 8px 20px;
            font-size: 14px;
            margin-top: 20px;
        }
        
        /* 兑换弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal {
            background: #16213e;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal h3 { margin-bottom: 15px; }
        .modal p { color: #aaa; margin-bottom: 20px; }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-buttons button { flex: 1; }
        .btn-cancel { background: #555; }
        .btn-cancel:hover { background: #444; }
        
        /* 成功提示 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #16c79a;
            color: #fff;
            padding: 15px 30px;
            border-radius: 10px;
            display: none;
            z-index: 200;
        }
    </style>
</head>
<body>

    <!-- 登录界面 -->
    <div class="card" id="loginCard">
        <h1>🎮 氏族积分中心</h1>
        <input type="text" id="username" placeholder="账号" autocomplete="off">
        <input type="password" id="password" placeholder="密码">
        <button onclick="login()">登 录</button>
        <p class="error" id="errorMsg">账号或密码错误</p>
    </div>

    <!-- 主面板 -->
    <div class="card" id="dashboard">
        <div class="user-header">
            <div>
                <h2 id="displayName">--</h2>
                <p style="color:#aaa;font-size:13px;margin-top:4px;" id="displayRank">--</p>
            </div>
            <div class="points-box">💎 <span id="displayPoints">0</span></div>
        </div>
        
        <p class="section-title">🛒 积分兑换</p>
        <div id="shopList"></div>
        
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>

    <!-- 兑换确认弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>确认兑换？</h3>
            <p id="modalText">确定要兑换吗？</p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button onclick="confirmRedeem()">确定兑换</button>
            </div>
        </div>
    </div>

    <!-- 成功提示 -->
    <div class="toast" id="toast">✅ 兑换申请已提交！</div>

    <script>
        // ==================== 替换这里 ====================
        const SUPABASE_URL = 'https://rfmgembzxqbqsegquxmh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9qFlq7jJcXvnkZOIoxinug_RVotHtGw';
        // ==================================================

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;
        let shopItems = [];
        let selectedItem = null;

        // 自动登录
        async function autoLogin() {
            const savedId = localStorage.getItem('clan_user_id');
            if (!savedId) return;
            
            const { data } = await supabase
                .from('game_users')
                .select('*')
                .eq('id', savedId)
                .single();
            
            if (data) {
                currentUser = data;
                showDashboard();
            }
        }

        // 登录
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase
                .from('game_users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .single();
            
            if (error || !data) {
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }
            
            currentUser = data;
            localStorage.setItem('clan_user_id', data.id);
            showDashboard();
        }

        // 显示主面板
        function showDashboard() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            document.getElementById('displayName').textContent = currentUser.username;
            document.getElementById('displayRank').textContent = currentUser.clan_rank;
            document.getElementById('displayPoints').textContent = currentUser.total_points;
            
            loadShop();
        }

        // 加载兑换物品
        async function loadShop() {
            const { data } = await supabase
                .from('shop_items')
                .select('*')
                .eq('is_active', true);
            
            shopItems = data;
            const list = document.getElementById('shopList');
            list.innerHTML = '';
            
            data.forEach(item => {
                const canBuy = currentUser.total_points >= item.points_cost && item.stock !== 0;
                const stockText = item.stock === -1 ? '无限' : `剩余 ${item.stock}`;
                
                list.innerHTML += `
                    <div class="shop-item">
                        <div class="shop-item-info">
                            <h3>${item.name}</h3>
                            <p>${item.description} | 库存：${stockText}</p>
                        </div>
                        <div style="display:flex;align-items:center;">
                            <span class="shop-item-cost">${item.points_cost} 分</span>
                            <button class="btn-small" 
                                    onclick="openRedeem('${item.id}')"
                                    ${!canBuy ? 'disabled' : ''}>
                                ${canBuy ? '兑换' : '不足'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 打开兑换确认
        function openRedeem(itemId) {
            selectedItem = shopItems.find(i => i.id === itemId);
            document.getElementById('modalText').textContent = 
                `确定要兑换「${selectedItem.name}」吗？将扣除 ${selectedItem.points_cost} 积分。`;
            document.getElementById('modal').style.display = 'flex';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            selectedItem = null;
        }

        // 确认兑换
        async function confirmRedeem() {
            if (!selectedItem) return;
            
            // 写入兑换记录（这就是你收到的通知）
            await supabase.from('redemptions').insert({
                user_id: currentUser.id,
                item_id: selectedItem.id,
                item_name: selectedItem.name,
                status: 'pending'
            });
            
            closeModal();
            showToast();
        }

        // 显示成功提示
        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2500);
        }

        // 退出
        function logout() {
            localStorage.removeItem('clan_user_id');
            location.reload();
        }

        // 启动
        autoLogin();
    </script>
</body>
</html>
